// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    apply from: "./common_support.gradle"

    ext.component_router_doc_folder = "./Doc"
    ext.component_router_doc_enable = false

    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        classpath libs.gradle
        classpath libs.kotlin.gradle.plugin
        // 组件化的
        classpath libs.component.plugin
    }

}

plugins {
    alias(libs.plugins.compose.compiler) apply false
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.parcelize) apply false
    alias(libs.plugins.kotlin.ksp) apply false
}

// JitPack 会为每个子项目注入一个以项目名命名的 publication，与各模块显式声明的坐标冲突
// （Gradle 报 "multiple publications that have different coordinates"）。这里把它对齐到显式坐标。
gradle.projectsEvaluated {
    rootProject.allprojects { p ->
        if (p.plugins.hasPlugin('maven-publish')) {
            def pubs = p.publishing.publications
            def injected = pubs.findByName(p.name)
            def ours = pubs.findByName('release') ?: pubs.findByName('maven')
            if (injected != null && ours != null) {
                injected.groupId = ours.groupId
                injected.artifactId = ours.artifactId
                injected.version = ours.version
            }
        }
    }
}
